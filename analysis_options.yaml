# Reglas de análisis de Rinde Mobile. `flutter analyze` debe quedar en cero antes de cada PR.
include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 110

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - prefer_single_quotes
    - prefer_final_locals
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures
